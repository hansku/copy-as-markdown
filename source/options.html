<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy as Markdown Settings</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2937;
            --primary-color: #4f46e5;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1f2937;
                --text-color: #f9fafb;
                --primary-color: #6366f1;
                --border-color: #374151;
            }
        }

        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1 {
            margin-bottom: 2rem;
        }

        .option-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        button {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Settings</h1>
    <form id="options-form">
        <div class="option-group">
            <label for="headingStyle">Heading Style</label>
            <select id="headingStyle">
                <option value="atx">ATX (### Heading)</option>
                <option value="setext">Setext (Heading\n---)</option>
            </select>
        </div>

        <div class="option-group">
            <label for="bulletListMarker">Bullet List Marker</label>
            <select id="bulletListMarker">
                <option value="-">- (Dash)</option>
                <option value="*">* (Asterisk)</option>
                <option value="+">+ (Plus)</option>
            </select>
        </div>

        <!-- Add more options here later -->

        <button type="submit">Save</button>
        <span id="status" style="margin-left: 1rem; font-size: 0.875rem;"></span>
    </form>

    <footer
        style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.875rem; color: var(--text-color); opacity: 0.8;">
        <p>Based on <strong>Copy as Markdown</strong> by <a href="https://github.com/notlmn" target="_blank"
                style="color: var(--primary-color);">Laxman Damera</a>.</p>
    </footer>
    <script type="module" src="options.ts"></script>
</body>

</html>
